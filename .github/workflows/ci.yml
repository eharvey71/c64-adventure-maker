name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # VICE lets tests/test_c64build.py check the pure-Python tokeniser
      # and disk writer byte for byte against the real petcat and c1541.
      - name: Install Tkinter, a virtual display and VICE
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb vice

      - name: Byte-compile the editor
        run: python -m py_compile adventure_editor_v7.py

      # Lets tests/test_graphical_build.py run the editor's real build.
      - name: Build script_compiler
        run: sh tools/setup_compiler.sh

      # xvfb-run gives the GUI smoke tests a display; without one they skip.
      - name: Run tests
        run: xvfb-run -a python -m unittest discover -s tests -v

  # The GUI tests also run under macOS's own window system (Aqua), which
  # behaves differently from Linux's Xvfb: a hang there once went unnoticed
  # because CI only ever ran Linux. The timeout turns a hang into a failure.
  test-macos:
    name: tests (macOS, Python 3.12)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tkinter is available
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Run tests
        run: python -m unittest discover -s tests -v

  syntax-floor:
    name: Python 3.8 syntax floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # README advertises Python 3.8+. Parsing with feature_version=(3, 8)
      # rejects any newer grammar (walrus-in-comprehension, match, PEP 701
      # f-strings, ...) without needing an EOL interpreter on the runner.
      - name: Reject syntax newer than Python 3.8
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          bad = False
          for path in pathlib.Path(".").rglob("*.py"):
              if ".git" in path.parts:
                  continue
              try:
                  ast.parse(path.read_text(), filename=str(path),
                            feature_version=(3, 8))
              except SyntaxError as e:
                  print(f"::error file={path},line={e.lineno}::"
                        f"needs Python > 3.8: {e.msg}")
                  bad = True
          sys.exit(1 if bad else 0)
          PY

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check
        run: for f in tools/*.sh; do sh -n "$f"; done
      - name: ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck --severity=warning tools/*.sh

  compiler:
    name: Build script_compiler from pinned source
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # Proves the pin in setup_compiler.sh still matches the patches in
      # fix_storytllr_compiler.sh, and that the shim still compiles.
      - name: Run one-command setup
        run: sh tools/setup_compiler.sh

      - name: Compiler is executable
        run: test -x tools/script_compiler

  # The editor's builds, run inside a real browser: StoryTllr's compiler
  # built as WebAssembly with Emscripten, the editor's Python under Pyodide.
  # Both disks must be byte-identical to the desktop editor's.
  web:
    name: Browser build (Emscripten)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EMSDK_VERSION: latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The native compiler, for the desktop side of the comparison, and
      # the patched source the WebAssembly build uses.
      - name: Build script_compiler
        run: sh tools/setup_compiler.sh

      # Emscripten's own installer, from the Emscripten project.
      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"

      - name: Build the browser version
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcc --version | head -1
          bash web/build.sh

      # Fast check without a browser: build the compiler for Node and
      # compare every file it writes with the native compiler's.
      - name: The WebAssembly compiler matches the native one
        timeout-minutes: 5
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          bash web/check_compiler.sh

      # Only when that fails: which compiler settings do work.
      - name: Diagnose with other compiler settings
        if: failure()
        timeout-minutes: 10
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          for opt in "-O2 -sTOTAL_STACK=8MB" "-O0 -sASSERTIONS=2 -sSTACK_OVERFLOW_CHECK=2" "-O0"; do
            OPT="$opt" bash web/check_compiler.sh || true
          done

      - name: Install Chromium for the test
        working-directory: web
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium

      - name: The desktop editor's disks, for comparison
        timeout-minutes: 3
        run: python web/reference.py

      - name: The sample castle builds identically in the browser
        timeout-minutes: 5
        run: node web/test_browser.cjs

      - name: So does the castle with full-size art on every room
        timeout-minutes: 5
        run: |
          python web/art_game.py "$RUNNER_TEMP/art_castle.json"
          node web/test_browser.cjs "$RUNNER_TEMP/art_castle.json"
