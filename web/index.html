<!doctype html>
<!--
  Proof that the editor's builds run entirely in a browser.

  Loads Pyodide and the editor's own Python files, then calls the same build
  functions the desktop editor uses (build_text_disk, build_graphical_disk).
  The one difference is the compiler: the page hands build_graphical_disk a
  JavaScript function that runs StoryTllr's compiler built as WebAssembly.

  The result is a pair of SHA-256 hashes in window.result, which
  test_browser.cjs compares with the desktop editor's own disks. Pick a game
  with ?game=file.json.
-->
<meta charset="utf-8">
<title>Browser Build Proof</title>
<pre id="log"></pre>
<script src="pyodide/pyodide.js"></script>
<script src="compiler/compiler.js"></script>
<script>
const log = (m) => { document.getElementById("log").textContent += m + "\n"; };
async function bytes(url) { return new Uint8Array(await (await fetch(url)).arrayBuffer()); }

(async () => {
  const t0 = performance.now();
  const py = await loadPyodide({ indexURL: "pyodide/" });
  log("pyodide " + py.version);
  // the editor's own Python files, plus engine files and the game
  for (const d of ["/repo/engine", "/repo/legacy"]) py.FS.mkdirTree(d);
  for (const f of ["adventure_editor_v7.py", "c64build.py", "engine/font.png", "engine/stdlib.hjt",
                   "engine/storytllr64.prg", "legacy/advplay-c64-current.bas"])
    py.FS.writeFile("/repo/" + f, await bytes("repo/" + f));
  const game = new URLSearchParams(location.search).get("game") || "example_castle.json";
  py.FS.writeFile("/game.json", await bytes(game));

  // The compiler for build_graphical_disk: one fresh WebAssembly instance,
  // with its own in-memory file system. The project folder is copied in,
  // compiled, and everything the compiler wrote is copied back.
  const output = [];
  const C = await createCompiler({ print: (l) => output.push(l), printErr: (l) => output.push(l) });
  const copyTree = (from, to, dir) => {
    to.mkdirTree(dir);
    for (const n of from.readdir(dir)) {
      if (n === "." || n === "..") continue;
      const p = dir + "/" + n;
      if (from.isDir(from.stat(p).mode)) copyTree(from, to, p);
      else to.writeFile(p, from.readFile(p));
    }
  };
  globalThis.compileWithWasm = (projDir, script) => {
    copyTree(py.FS, C.FS, projDir);
    C.FS.chdir(projDir);
    C.ccall("compile_game", "number", ["string", "string", "string"],
            [script, "tmp.h", "advcartridge"]);
    copyTree(C.FS, py.FS, projDir);
    return output.join("\n");
  };

  // Both builds, through the editor's shared functions.
  const out = py.runPython(`
import hashlib, json, sys
from pathlib import Path
sys.path.insert(0, "/repo")
import adventure_editor_v7 as ed
from js import compileWithWasm

game = json.loads(Path("/game.json").read_text())
engine = Path("/repo/engine")
graphical = ed.build_graphical_disk(
    game, "/proj", compileWithWasm, engine / "stdlib.hjt",
    (engine / "storytllr64.prg").read_bytes(), font_png=engine / "font.png")
text = ed.build_text_disk(
    game, Path("/repo/legacy/advplay-c64-current.bas").read_text())["disk"]
json.dumps({"graphical": hashlib.sha256(graphical).hexdigest(),
            "text": hashlib.sha256(text).hexdigest()})
`);
  window.result = JSON.parse(out);
  window.result.seconds = ((performance.now() - t0) / 1000).toFixed(1);
  log(JSON.stringify(window.result));
})().catch((e) => { window.result = { error: String(e) }; log("ERROR " + e); });
</script>
